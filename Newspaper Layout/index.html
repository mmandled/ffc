<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newspaper Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="newspaper-layout">

  <header class="title">
    <h1>Daily News</h1>
  </header>

  <article class="feature-article">
    <h2>Main Headline</h2>
    <p>This is the main news article of the day.</p>
  </article>

  <figure class="cover-image">
    <img src="https://cdn.freecodecamp.org/curriculum/css-grid-news-paper-cover.png" alt="Newspaper Cover">
  </figure>

  <article class="secondary-article">
    <h2>More News</h2>
    <p>This is another important news article.</p>
  </article>

  <article class="small-article1">
    <h3>Sports</h3>
    <p>Latest sports updates.</p>
  </article>

  <article class="small-article2">
    <h3>Technology</h3>
    <p>New tech stories.</p>
  </article>

  <article class="small-article3">
    <h3>Entertainment</h3>
    <p>Celebrity and movie news.</p>
  </article>

</main>

</body>
</html>
